<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA图标生成器</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
        }
        
        .icons-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .icon-item {
            text-align: center;
            padding: 20px;
            background: #f8fafc;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
        }
        
        .icon-item canvas {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            margin-bottom: 10px;
        }
        
        .icon-item p {
            margin: 10px 0;
            font-weight: bold;
            color: #475569;
        }
        
        .icon-item button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: transform 0.2s;
        }
        
        .icon-item button:hover {
            transform: translateY(-2px);
        }
        
        .instructions {
            background: #e0e7ff;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .instructions h2 {
            color: #667eea;
            margin-top: 0;
        }
        
        .instructions ol {
            margin: 0;
            padding-left: 20px;
        }
        
        .instructions li {
            margin-bottom: 10px;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 智慧停车 PWA图标生成器</h1>
        
        <div class="instructions">
            <h2>使用说明：</h2>
            <ol>
                <li>点击下方每个图标下方的"下载"按钮</li>
                <li>将下载的图标保存到 <code>public/icons/</code> 目录</li>
                <li>确保文件名与按钮上显示的名称一致</li>
                <li>所有图标生成完成后，PWA应用就可以正常使用了</li>
            </ol>
        </div>
        
        <div class="icons-grid" id="iconsGrid"></div>
    </div>
    
    <script>
        const iconSizes = [16, 32, 72, 96, 128, 144, 152, 192, 384, 512];
        
        function drawIcon(ctx, size) {
            // 背景
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');
            
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, size * 0.15);
            ctx.fill();
            
            // 停车场主体
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.beginPath();
            ctx.roundRect(size * 0.12, size * 0.2, size * 0.76, size * 0.6, size * 0.04);
            ctx.fill();
            
            // 停车位线条
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = size * 0.015;
            ctx.lineCap = 'round';
            
            ctx.beginPath();
            ctx.moveTo(size * 0.27, size * 0.29);
            ctx.lineTo(size * 0.27, size * 0.71);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(size * 0.5, size * 0.29);
            ctx.lineTo(size * 0.5, size * 0.71);
            ctx.stroke();
            
            ctx.beginPath();
            ctx.moveTo(size * 0.73, size * 0.29);
            ctx.lineTo(size * 0.73, size * 0.71);
            ctx.stroke();
            
            // 停车位标记点
            ctx.fillStyle = '#10b981';
            ctx.beginPath();
            ctx.arc(size * 0.27, size * 0.25, size * 0.025, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.beginPath();
            ctx.arc(size * 0.5, size * 0.25, size * 0.025, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ef4444';
            ctx.beginPath();
            ctx.arc(size * 0.73, size * 0.25, size * 0.025, 0, Math.PI * 2);
            ctx.fill();
            
            // P标志
            ctx.fillStyle = '#10b981';
            ctx.beginPath();
            ctx.arc(size * 0.5, size * 0.5, size * 0.06, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.08}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('P', size * 0.5, size * 0.5);
        }
        
        function createIconItem(size) {
            const item = document.createElement('div');
            item.className = 'icon-item';
            
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            
            drawIcon(ctx, size);
            
            const p = document.createElement('p');
            p.textContent = `${size}x${size}`;
            
            const button = document.createElement('button');
            button.textContent = '下载';
            button.onclick = () => {
                canvas.toBlob((blob) => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `icon-${size}x${size}.png`;
                    a.click();
                    URL.revokeObjectURL(url);
                });
            };
            
            item.appendChild(canvas);
            item.appendChild(p);
            item.appendChild(button);
            
            return item;
        }
        
        // 生成所有图标
        const grid = document.getElementById('iconsGrid');
        iconSizes.forEach(size => {
            grid.appendChild(createIconItem(size));
        });
    </script>
</body>
</html>
