<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="512" height="512" rx="80" fill="url(#bg)"/>
  
  <!-- 停车场主体 -->
  <rect x="60" y="100" width="392" height="312" rx="20" fill="white" opacity="0.95"/>
  
  <!-- 停车位线条 -->
  <line x1="140" y1="150" x2="140" y2="362" stroke="#667eea" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="150" x2="256" y2="362" stroke="#667eea" stroke-width="8" stroke-linecap="round"/>
  <line x1="372" y1="150" x2="372" y2="362" stroke="#667eea" stroke-width="8" stroke-linecap="round"/>
  
  <!-- 停车位标记点 -->
  <circle cx="140" cy="130" r="12" fill="#10b981"/>
  <circle cx="256" cy="130" r="12" fill="#10b981"/>
  <circle cx="372" cy="130" r="12" fill="#ef4444"/>
  
  <!-- 汽车图标 -->
  <g transform="translate(100, 200)">
    <rect x="0" y="20" width="80" height="40" rx="8" fill="#667eea"/>
    <rect x="10" y="0" width="60" height="25" rx="6" fill="#764ba2"/>
    <circle cx="15" cy="60" r="8" fill="#333"/>
    <circle cx="65" cy="60" r="8" fill="#333"/>
  </g>
  
  <!-- P标志 -->
  <g transform="translate(220, 200)">
    <circle cx="36" cy="30" r="30" fill="#10b981"/>
    <text x="36" y="42" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="white" text-anchor="middle">P</text>
  </g>
  
  <!-- 汽车图标2 -->
  <g transform="translate(332, 200)">
    <rect x="0" y="20" width="80" height="40" rx="8" fill="#ef4444" opacity="0.5"/>
    <rect x="10" y="0" width="60" height="25" rx="6" fill="#ef4444" opacity="0.5"/>
    <circle cx="15" cy="60" r="8" fill="#333" opacity="0.5"/>
    <circle cx="65" cy="60" r="8" fill="#333" opacity="0.5"/>
  </g>
  
  <!-- 底部文字 -->
  <text x="256" y="460" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">智慧停车</text>
</svg>
