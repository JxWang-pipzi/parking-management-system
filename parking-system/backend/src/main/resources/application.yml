server:
  port: 8080
  servlet:
    context-path: /api

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/parking_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&useAffectedRows=true
    username: root
    password: "REMOVED_PASSWORD"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-test-query: SELECT 1
      connection-timeout: 30000
      maximum-pool-size: 10
      minimum-idle: 5
  redis:
    enabled: false
    host: localhost
    port: 6379
    password:
    database: 0
  security:
    user:
      name: admin
      password: admin
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.parking.system.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      field-strategy: not_empty
      logic-delete-value: 1
      logic-not-delete-value: 0

swagger:
  enabled: true

jwt:
  secret: P4rk1ngSys2024$SecureJWT!Key#Hmac256@Generated
  expiration: 86400000
  refresh-expiration: 604800000

logging:
  level:
    com.parking.system: debug

map:
  route:
    enabled: false
    provider: tencent
    key: ${TENCENT_MAP_KEY:}
    estimated-walking-speed-meters-per-minute: 72

ocr:
  service:
    url: ${OCR_SERVICE_URL:http://127.0.0.1:5000/recognize}
